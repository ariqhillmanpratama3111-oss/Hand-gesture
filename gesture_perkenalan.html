<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Perkenalan Gesture Jari</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f6f4;--card:#fff;--text:#1d1d1b;--muted:#6b6b66;--accent:#2563eb;--line:#d9d9d4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141416;--card:#1e1e22;--text:#f1f1ee;--muted:#9a9a94;--accent:#5b8cff;--line:#33333a}}
:root[data-theme="dark"]{--bg:#141416;--card:#1e1e22;--text:#f1f1ee;--muted:#9a9a94;--accent:#5b8cff;--line:#33333a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:14px;max-width:560px;margin-inline:auto}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
canvas{width:100%;border-radius:10px;background:#000;display:block}
button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:16px;width:100%}
#out{font-size:22px;font-weight:600;text-align:center;min-height:34px;margin:10px 0 2px}
#dbg{text-align:center;color:var(--muted);font-family:monospace;font-size:14px}
textarea{width:100%;height:170px;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font-family:monospace;font-size:14px}
small{color:var(--muted);display:block;margin:6px 0}
</style>
</head>
<body>
<h1>🖐️ Perkenalan Pakai Jari</h1>
<div class="card">
  <canvas id="c" width="480" height="640"></canvas>
  <div id="out"></div>
  <div id="dbg">belum mulai</div>
  <button id="start">Mulai Kamera</button>
</div>
<div class="card">
  <b>Atur gesture</b>
  <small>Format: jempol,telunjuk,tengah,manis,kelingking = teks (1 tegak, 0 nutup)</small>
  <textarea id="cfg" spellcheck="false"></textarea>
  <button id="save" style="margin-top:8px">Simpan</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
<script>
const DEFAULT = `0,1,0,0,0 = Salam kenal
1,0,0,0,0 = Halo
0,1,0,0,1 = Nama saya Ariq Hillman Pratama 
0,1,1,0,0 = Perkenalkan
0,0,0,0,1 = Kelas sepuluh
1,1,1,1,1 = Terima kasih
1,1,0,0,1 = Anjay Gacor`;
const HOLD = 10, COOLDOWN = 2000;
const $ = id => document.getElementById(id);
let G = {};

function parse(t){
  const g = {};
  t.split("\n").forEach(l => {
    const i = l.indexOf("=");
    if (i < 0) return;
    const k = l.slice(0, i).split(",").map(s => s.trim()).join(",");
    if (/^[01],[01],[01],[01],[01]$/.test(k)) g[k] = l.slice(i + 1).trim();
  });
  return g;
}
let saved = null;
try { saved = localStorage.getItem("gestures"); } catch (e) {}
$("cfg").value = saved || DEFAULT;
G = parse($("cfg").value);
$("save").onclick = () => {
  G = parse($("cfg").value);
  try { localStorage.setItem("gestures", $("cfg").value); } catch (e) {}
  $("save").textContent = "Tersimpan ✓ (" + Object.keys(G).length + " gesture)";
  setTimeout(() => $("save").textContent = "Simpan", 1500);
};

function speak(t){
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = "id-ID"; u.rate = 0.95;
    speechSynthesis.speak(u);
  } catch (e) {}
}

function fingers(lm, label){
  const f = [];
  f.push(label === "Right" ? (lm[4].x < lm[3].x ? 1 : 0) : (lm[4].x > lm[3].x ? 1 : 0));
  [[8,6],[12,10],[16,14],[20,18]].forEach(([t,p]) => f.push(lm[t].y < lm[p].y ? 1 : 0));
  return f;
}

const cv = $("c"), ctx = cv.getContext("2d");
const video = document.createElement("video");
video.setAttribute("playsinline", ""); video.muted = true;
let cand = null, cnt = 0, lastKey = null, lastT = 0;

function onResults(r){
  ctx.save();
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.drawImage(r.image, 0, 0, cv.width, cv.height);
  ctx.restore();
  if (r.multiHandLandmarks && r.multiHandLandmarks.length){
    const lm = r.multiHandLandmarks[0];
    const label = r.multiHandedness[0].label;
    ctx.fillStyle = "#22d3ee";
    lm.forEach(p => { ctx.beginPath(); ctx.arc(p.x*cv.width, p.y*cv.height, 4, 0, 7); ctx.fill(); });
    const key = fingers(lm, label).join(",");
    $("dbg").textContent = "fingers: [" + key + "]";
    if (G[key]){
      if (key === cand) cnt++; else { cand = key; cnt = 1; }
      if (cnt >= HOLD){
        $("out").textContent = G[key];
        const now = Date.now();
        if (key !== lastKey && now - lastT > COOLDOWN){ speak(G[key]); lastKey = key; lastT = now; }
      }
    } else { cand = null; cnt = 0; }
  } else {
    $("dbg").textContent = "tangan tidak terlihat";
    cand = null; cnt = 0; lastKey = null;
  }
}

$("start").onclick = async () => {
  $("start").disabled = true; $("start").textContent = "Memuat model…";
  try { speechSynthesis.speak(new SpeechSynthesisUtterance("")); } catch (e) {}
  try {
    const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user", width:480, height:640}, audio:false});
    video.srcObject = stream; await video.play();
  } catch (e) {
    $("dbg").textContent = "Kamera gagal: " + e.message + " (buka link ini di Chrome & izinkan kamera)";
    $("start").disabled = false; $("start").textContent = "Coba lagi";
    return;
  }
  const hands = new Hands({locateFile: f => "https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/" + f});
  hands.setOptions({maxNumHands:1, modelComplexity:0, minDetectionConfidence:0.7, minTrackingConfidence:0.7});
  hands.onResults(onResults);
  const buf = document.createElement("canvas");
  buf.width = 480; buf.height = 640;
  const bctx = buf.getContext("2d");
  $("start").textContent = "Jalan ✓";
  const loop = async () => {
    // mirror frame biar sama kayak selfie view
    bctx.save(); bctx.scale(-1, 1);
    bctx.drawImage(video, -buf.width, 0, buf.width, buf.height);
    bctx.restore();
    await hands.send({image: buf});
    requestAnimationFrame(loop);
  };
  loop();
};
</script>
</body>
</html>
